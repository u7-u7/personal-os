[project]
name = "personalos-api"
version = "0.1.0"
description = "PersonalOS authenticated Agent API and worker services"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1", "cryptography>=44,<47", "httpx>=0.28,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3.0,<4", "langchain-openai>=1.0,<2",
  "redis>=6,<8", "croniter>=6,<7", "mcp>=1.20,<2", "email-validator>=2.2,<3"
]
[project.optional-dependencies]
integrations = ["hy-memory==2.0.7", "typesafe-sdk==0.7.5"]
jev = ["typesafe-sdk==0.7.5"]
hy-memory = ["hy-memory==2.0.7"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["personalos"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
